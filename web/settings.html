<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 · 课堂讨论复盘</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#263448;font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:920px;padding:36px 26px;margin:auto}a{color:#3d5bae;text-decoration:none}h1{font-size:27px;margin:24px 0 8px}h2{font-size:16px;margin:0 0 18px}p{font-size:12px;line-height:1.8;color:#7c899c}.card{margin:24px 0;background:white;border:1px solid #e0e6ef;border-radius:13px;padding:24px}.row{display:grid;grid-template-columns:160px 1fr;padding:12px 0;border-bottom:1px solid #eef1f6}.row:last-child{border:0}.label{font-size:12px;color:#7a879c}.value{font-size:13px;overflow-wrap:anywhere}.badge{display:inline-block;background:#edf2fb;color:#5672a5;padding:4px 9px;border-radius:5px;font-size:11px}code{font-size:12px;overflow-wrap:anywhere;color:#677891}.error{color:#a44}@media(max-width:600px){main{padding:24px 16px}.row{grid-template-columns:110px 1fr}.card{padding:20px}}
</style></head><body><main><a href="/">← 返回首页</a><h1>设置</h1><p>查看模型连接与当前使用的配置。</p><div id="settings" aria-live="polite">正在读取配置…</div></main><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const row=(a,b)=>`<div class="row"><span class="label">${esc(a)}</span><span class="value">${esc(b)}</span></div>`;
fetch('/api/settings').then(async r=>{if(!r.ok)throw Error('无法读取当前配置');return r.json()}).then(s=>{const a=s.active;document.getElementById('settings').innerHTML=`<section class="card"><h2>当前模型连接</h2>${row('模型',a.model)}${row('连接方式',a.connection==='codex_login'?'Codex登录':'兼容API')}${a.reasoning?row('推理强度',a.reasoning):''}${row('认证来源',a.authentication)}${row('连接状态',a.authentication_status)}${row('服务地址',a.endpoint)}<p>${a.connection==='codex_login'?'当前使用本机Codex登录，不需要在项目中填写API Key。':'API Key来自本机配置文件，页面不显示密钥内容。'}</p></section><section class="card"><h2>调用限制</h2>${row('服务进程请求上限',s.limits.process_requests+'次')}${row('服务进程token阈值',s.limits.process_token_threshold.toLocaleString())}<p>阈值按接口返回的用量累计；单次响应可能超过token软阈值。重启服务会重新计数。</p></section><section class="card"><h2>配置来源 <span class="badge">只读</span></h2>${row('当前配置来源',a.config_source)}${row('项目默认模型',s.defaults.model)}${row('项目默认推理强度',s.defaults.reasoning_effort)}${row('自动切换模型',s.defaults.fallback?'开启':'关闭')}<p>配置文件格式示例：</p><code>${esc(s.config_file)}</code><p>此页用于查看，暂不支持网页修改。修改本机配置后，需要重启服务才会生效。</p><details><summary>使用其他兼容API</summary><p>启动服务时通过 <code>--provider-env</code> 指定本机配置文件。文件字段为 <code>CHEMTUTOR_BASE_URL</code>、<code>CHEMTUTOR_MODEL</code>、<code>CHEMTUTOR_API_KEY</code>。也可以通过同名环境变量提供配置。示例文件不包含真实密钥。</p></details></section>`}).catch(e=>{const el=document.getElementById('settings');el.className='error';el.textContent=e.message});
</script></body></html>
