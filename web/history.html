<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史复盘</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202a38;font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1040px;margin:auto;padding:36px 28px}a{color:#3b59ae;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;margin:24px 0}h1{font-size:27px;margin:0}p{color:#7e8999;font-size:12px;margin:6px 0}.primary{background:#3b59ae;color:white;padding:10px 16px;border-radius:8px;font-size:13px}.search{display:flex;gap:10px;margin:25px 0}input{flex:1;min-width:0;padding:12px 14px;border:1px solid #dce2ec;border-radius:9px;font:inherit}button{font:inherit;border:1px solid #dce2ec;border-radius:9px;background:white;padding:10px 17px;cursor:pointer;color:#5e6e87}button:disabled{opacity:.4;cursor:default}.list{background:white;border:1px solid #e1e6ed;border-radius:12px;overflow:hidden}.item{display:flex;align-items:center;gap:20px;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #edf0f5}.item:last-child{border:none}.item h2{font-size:14px;font-weight:550;margin:0}.state{font-size:11px;color:#798699;background:#f3f5f8;padding:4px 9px;border-radius:5px;white-space:nowrap}.right{display:flex;align-items:center;gap:22px;white-space:nowrap;font-size:12px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:#7c889a;font-size:12px}.empty{padding:32px;text-align:center;color:#7c889a}.error{color:#a44} @media(max-width:650px){main{padding:24px 16px}.item{padding:18px 16px;align-items:start}.right{flex-direction:column;gap:9px}.item p{font-size:11px}}
dialog{border:1px solid #dce3ed;border-radius:14px;padding:25px;width:min(440px,90vw);color:#26344a}dialog::backdrop{background:#17253655}dialog h2{font-size:18px;margin-top:0}dialog input{width:100%;margin:10px 0 16px}.dialog-actions{display:flex;justify-content:end;gap:9px}.rename{background:transparent;border:0;padding:0;font-size:12px;color:#77849a}#rename-error{color:#a44;min-height:20px;font-size:12px}.save{background:#3b59ae;color:white}
</style></head><body><main><a href="/">← 返回首页</a>　·　<a href="/settings">设置</a><header><div><h1>历史复盘</h1><p>查看已保存的讨论、处理结果和讲解。</p></div><a class="primary" href="/">新建复盘</a></header><form class="search" id="search"><input id="query" aria-label="搜索历史复盘" placeholder="按标题搜索"><button type="submit">搜索</button></form><div id="count"></div><div class="list" id="list" aria-live="polite">正在读取历史记录…</div><div class="pager"><span id="range"></span><div><button id="prev" disabled>上一页</button> <button id="next" disabled>下一页</button></div></div></main><dialog id="rename-dialog"><form id="rename-form"><h2>重命名复盘</h2><label for="name">复盘名称</label><input id="name" maxlength="120" required aria-label="复盘名称"><p id="rename-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="save" id="save-name">保存</button></div></form></dialog><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let offset=0,query='',token=0;const limit=20;
function state(j){if(j.status==='failed')return '未完成';if(j.status!=='completed')return '未完成';return j.has_material?'已生成讲解':j.decision==='no_correction'?'无需追加讲解':j.decision==='insufficient_evidence'?'资料不足':'已有核查结果'}
async function load(){const n=++token;$('prev').disabled=$('next').disabled=true;try{const r=await fetch('/api/workbench-history?'+new URLSearchParams({q:query,offset,limit}));if(!r.ok)throw Error('暂时无法读取历史记录');const d=await r.json();if(n!==token)return;$('count').innerHTML=`<p>${d.total}份记录${query?' · 搜索结果':' · 包含此前保存的实验记录'}</p>`;$('list').innerHTML=d.items.map(j=>`<article class="item"><div><h2>${esc(j.title)}</h2><p>${esc(j.started_at.replace('T',' '))} · ${j.turns}轮讨论 · ${j.materials}份资料</p></div><div class="right"><span class="state">${esc(state(j))}</span><button class="rename" data-id="${esc(j.id)}" data-name="${esc(j.title)}">重命名</button><a href="/workbench?mode=focused&job=${encodeURIComponent(j.id)}">打开复盘 →</a></div></article>`).join('')||'<div class="empty">没有找到复盘记录</div>';$('range').textContent=d.total?`${offset+1}–${Math.min(offset+limit,d.total)} / ${d.total}`:'0份记录';$('prev').disabled=offset===0;$('next').disabled=offset+limit>=d.total}catch(e){if(n===token)$('list').innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}
let renaming=null;document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;renaming=b.dataset.id;$('name').value=b.dataset.name;$('rename-error').textContent='';$('rename-dialog').showModal();$('name').focus();$('name').select()});$('cancel').onclick=()=>$('rename-dialog').close();$('rename-form').onsubmit=async e=>{e.preventDefault();$('save-name').disabled=true;try{const r=await fetch('/api/workbench-rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:renaming,name:$('name').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'保存失败');$('rename-dialog').close();await load()}catch(e){$('rename-error').textContent=e.message}finally{$('save-name').disabled=false}};$('search').onsubmit=e=>{e.preventDefault();query=$('query').value.trim();offset=0;load()};$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};load();
</script></body></html>
